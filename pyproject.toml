[tool.poetry]
name = "screening-pipeline"
version = "0.1.0"
description = "Screening pipeline for materials discovery"
authors = [
    "Elohan Veillon <elohan.veillon@univ-artois.fr>",
    "Astrid Klipfel <astridklipfel@gmail.com>",
]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.9"
pymatgen = ">=2023.10.11"
spglib = ">=2.0.0"
torch = "^2.3.0"

[tool.poetry.scripts]
cif_counter = 'screening_pipeline.scripts.cif_counter:main'
preprocess = 'screening_pipeline.scripts.preprocess:main'
vasp_relaxation = 'screening_pipeline.scripts.vasp_relaxation:main'
stability_screening = 'screening_pipeline.scripts.stability_screening:main'
metrics = 'screening_pipeline.scripts.metrics:main'
band_gap_screening = 'screening_pipeline.scripts.band_gap_screening:main'
delta_sol_inputs_writer = 'screening_pipeline.scripts.delta_sol_inputs_writer:main'
vasp_delta_sol_statics = 'screening_pipeline.scripts.vasp_delta_sol_statics:main'
delta_sol_calculator = 'screening_pipeline.scripts.delta_sol_calculator:main'
band_edge_pos_screening = 'screening_pipeline.scripts.band_edge_pos_screening:main'

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
